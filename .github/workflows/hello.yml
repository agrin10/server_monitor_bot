name: My First GitHub Action

on:
  push:
    branches:
      - git-action        # also double check: is this "git-actiin" or "git-action"?
  workflow_dispatch:

jobs:
  my-first-action:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: list repo files
        run: ls -la

      - name: print a message
        run: echo "deploying to $ENVIRONMENT"
        env:
          ENVIRONMENT: staging