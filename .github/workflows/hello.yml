name: My First GitHub Action

on:
  push:
    branches:
      - git-action
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: create a file
        run: echo "Built at $(date)" > build-info.txt

      - name: upload the file as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-info.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download the artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: show what we got
        run: cat build-info.txt