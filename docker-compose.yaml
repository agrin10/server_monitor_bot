services:
  redis:
    image: redis:alpine
    container_name: monitoring-redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  bot:
    build: .
    container_name: monitoring-bot
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    network_mode: "host"
    pid: "host"
    privileged: true
